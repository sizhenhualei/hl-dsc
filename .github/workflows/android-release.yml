name: Build & Release hl-dsc Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.2)'
        required: true
      version_code:
        description: 'Android versionCode (optional, defaults to android/app/build.gradle)'
        required: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            if [ ! -d "$SDK_DIR/platforms/android-34" ] || [ ! -d "$SDK_DIR/build-tools/34.0.0" ]; then
              "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
            fi
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Lint
        run: |
          pnpm run type
          pnpm run lint

      - name: Resolve Release Version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION_NAME="${TAG#v}"
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            VERSION_CODE="${{ github.event.inputs.version_code }}"
          else
            VERSION_CODE="$(grep -oE 'hldscVersionCode.*:[[:space:]]*[0-9]+' android/app/build.gradle | grep -oE '[0-9]+' | tail -n1 || echo 6)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build web bundle & sync Android assets
        run: |
          pnpm run build
          npx cap sync android
          node scripts/make-android-icons.mjs

      - name: Prepare Android signing
        id: signing
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret configured; building a debug-signed fallback APK instead."
            exit 0
          fi
          node -e "
            const fs = require('node:fs');
            const raw = (process.env.SIGNING_KEYSTORE_BASE64 || '').replace(/[^A-Za-z0-9+/=]/g, '');
            const buf = Buffer.from(raw, 'base64');
            console.log('Decoded keystore bytes:', buf.length);
            if (buf.length < 100) {
              console.error('Decoded keystore looks too small or invalid.');
              process.exit(1);
            }
            fs.writeFileSync('android/release.keystore', buf);
          "
          keytool -list -keystore android/release.keystore -storepass "${{ secrets.SIGNING_KEYSTORE_PASS || 'android' }}" -alias "${{ secrets.SIGNING_KEY_ALIAS || 'androiddebugkey' }}" > /dev/null
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK
        if: steps.signing.outputs.available == 'true'
        env:
          HLDSC_KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
          HLDSC_KEYSTORE_PASS: ${{ secrets.SIGNING_KEYSTORE_PASS || 'android' }}
          HLDSC_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'androiddebugkey' }}
          HLDSC_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS || 'android' }}
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PhldscVersionCode=${{ steps.ver.outputs.version_code }} \
            -PhldscVersionName=${{ steps.ver.outputs.version_name }} \
            --no-daemon

      - name: Build debug fallback APK
        if: steps.signing.outputs.available != 'true'
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PhldscVersionCode=${{ steps.ver.outputs.version_code }} \
            -PhldscVersionName=${{ steps.ver.outputs.version_name }} \
            --no-daemon

      - name: Prepare signed Release APK artifact
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/hl-dsc-${{ steps.ver.outputs.tag }}.apk"
          rm -f android/release.keystore

      - name: Prepare debug fallback APK artifact
        if: steps.signing.outputs.available != 'true'
        shell: bash
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/hl-dsc-${{ steps.ver.outputs.tag }}-debug.apk"
          rm -f android/release.keystore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: hl-dsc ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
