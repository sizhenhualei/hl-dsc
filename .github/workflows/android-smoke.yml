name: Android Emulator Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle & sync Android assets
        run: |
          pnpm run build
          npx cap sync android
          node scripts/make-android-icons.mjs

      - name: Build debug APK
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Run emulator and capture boot state
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb wait-for-device
            adb shell input keyevent 82 || true
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.hldsc.app
            adb shell am start -W -n com.hldsc.app/.MainActivity
            sleep 30
            adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' > focus.txt || true
            cat focus.txt
            if ! grep -q 'com.hldsc.app' focus.txt; then adb shell input keyevent 4 || true; sleep 3; adb shell am start -W -n com.hldsc.app/.MainActivity; sleep 10; fi
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml window.xml || true
            adb exec-out screencap -p > smoke.png
            adb logcat -d -v threadtime > logcat.txt
            adb shell dumpsys activity activities > activities.txt
            adb shell dumpsys webviewupdate > webview.txt || true

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-diagnostics
          path: |
            smoke.png
            logcat.txt
            activities.txt
            webview.txt
            focus.txt
            window.xml
          if-no-files-found: warn
          retention-days: 7
